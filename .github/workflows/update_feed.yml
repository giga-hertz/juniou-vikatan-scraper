name: Update Vikatan Scraped Feed

on:
  schedule:
    - cron: '15 */3 * * *'  # Runs every 30 minutes at non-peak minutes
  workflow_dispatch:        # Manual run trigger

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_vikatan.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || (git commit -m "chore: append new articles to feed.xml" && git push)
